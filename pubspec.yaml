name: adventure_runner
description: "A gamified running tracking application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.8

  # State Management & Service Locator
  flutter_bloc: ^8.1.3
  get_it: ^7.6.0

  # Geospatial & Location Services
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0

  # Step Counting
  pedometer: ^4.0.1

  # Data Storage & Utilities
  shared_preferences: ^2.2.2
  equatable: ^2.0.5
  permission_handler: 11.3.1  # Dikunci ke versi 11.3.1 agar tidak meminta Android SDK 37

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/